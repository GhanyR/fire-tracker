name: bug report / laporan masalah
description: A reproducible problem with the map, data, playback, or exports.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem. Indonesian or English is fine.
        Use public coordinates only. Remove operation keys, tokens, private team locations, and personal information from screenshots and logs.
        This issue tracker is not an emergency-reporting channel.
  - type: textarea
    id: problem
    attributes:
      label: What happened? / Apa masalahnya?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Cara mengulang
      placeholder: |
        1. Open the map...
        2. Choose...
        3. Press...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device / Browser dan perangkat
      placeholder: Firefox 142, Android 15 / desktop
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Public map link and source time / Tautan peta dan waktu sumber
      description: If relevant, include the region, acquisition time, snapshot time, and public coordinates. Never include private session links or keys.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs / Bukti yang aman dibagikan
      description: Keep source dates and simulation labels visible. Remove private data before attaching.
